<!-- Store redirect defined EARLY: the first tap is never a "dead click", it shows
     instant feedback, and works even before the bottom script runs / inside the
     Instagram & Facebook in-app browsers. -->
<script>
  // Click handler for the store <a> tags. On iOS in-app browsers it drives the
  // navigation itself: itms-apps:// first (claimed directly by the App Store app, so
  // the webview's universal-link block doesn't apply), plain https 1s later if that
  // scheme goes unanswered.
  window.openStoreFromLink = function(store, location){
    var ua = navigator.userAgent || '';
    var isIOSInApp = /iphone|ipad|ipod/i.test(ua) &&
                     /instagram|fbav|fban|fb_iab|fbios|messenger/i.test(ua);
    if (isIOSInApp && store === 'AppStore') {
      try { if (window.trackStoreClick) window.trackStoreClick(store, location); } catch(e){}
      // PROVEN flow from the old page (russian_stories1.html, in production May–Aug):
      // fire itms-apps:// inside the tap gesture — Meta's webview hands it to the App
      // Store app — and only fall back after a FULL 1.5s. The hand-off takes ~0.5–1s;
      // the 350ms fallback this replaces fired while it was still in flight and
      // hijacked the pending navigation, so the tap looked dead (Clarity showed users
      // tapping repeatedly with nothing happening). If the App Store does open, the
      // page is backgrounded → pagehide/visibilitychange cancels every fallback.
      var IOS_NATIVE = 'itms-apps://apps.apple.com/app/id6740998772';
      var IOS_WEB    = 'https://apps.apple.com/app/id6740998772';
      var isIG = /instagram/i.test(ua);
      var timers = [];
      var cancel = function(){ while (timers.length) { try { clearTimeout(timers.pop()); } catch(e){} } };
      window.addEventListener('pagehide', cancel, { once:true });
      document.addEventListener('visibilitychange', function(){ if (document.hidden) cancel(); }, { once:true });
      if (isIG) {
        // Instagram's own escape scheme opens the URL in the EXTERNAL browser (Safari),
        // and since Nov 2025 apps.apple.com 301s iOS straight into the native App Store
        // from there. Try it if itms-apps:// went unanswered; plain https is the last
        // resort (inside the IG webview that 301 can dead-end, so it goes last).
        timers.push(setTimeout(function(){
          if (document.hidden) return;
          try { window.location.href = 'instagram://extbrowser/?url=' + encodeURIComponent(IOS_WEB); } catch(e){}
        }, 1500));
        timers.push(setTimeout(function(){
          if (document.hidden) return;
          window.location.href = IOS_WEB;
        }, 3000));
      } else {
        timers.push(setTimeout(function(){
          if (document.hidden) return;
          window.location.href = IOS_WEB;
        }, 1500));
      }
      try { window.location.href = IOS_NATIVE; } catch(e){}
      return false; // we drive the navigation ourselves
    }
    openStore(store, location);
    return false;
  };
  // Opens the store reliably (native scheme first, https fallback). Defined here so a
  // tap before the bottom script is ready still works. trackStoreClick is guarded — it
  // just no-ops on an ultra-early tap; the full version below adds tracking.
  window.openStore = function(store, location){
    try { if (window.trackStoreClick) window.trackStoreClick(store, location); } catch(e){}
    var ua = navigator.userAgent || '';
    var isIOS = /iphone|ipad|ipod/i.test(ua);
    var isAndroid = /android/i.test(ua);
    var IOS_URL = 'https://apps.apple.com/app/id6740998772';
    var IOS_NATIVE = 'itms-apps://apps.apple.com/app/id6740998772';
    var AND_PKG = 'com.luna.russianstories';
    var AND_HTTPS = 'https://play.google.com/store/apps/details?id=' + AND_PKG;
    // Instagram/Facebook/Messenger in-app browsers silently drop custom-scheme
    // navigations (itms-apps://, intent://) AND window.open — only plain https
    // top-level navigation is reliable there.
    var isInApp = /instagram|fbav|fban|fb_iab|fbios|messenger/i.test(ua);
    var goAndroid = (store === 'GooglePlay');
    var goIOS = (store === 'AppStore');
    if (!store) { goAndroid = isAndroid; goIOS = isIOS; }
    if (isInApp) {
      // iOS in-app + App Store is handled entirely by openStoreFromLink (itms-apps://
      // first, https fallback). Everything else here goes straight to plain https.
      window.location.href = goAndroid ? AND_HTTPS : IOS_URL;
      return;
    }
    if (goAndroid && isAndroid) {
      var intentUrl = 'intent://details?id=' + AND_PKG +
        '#Intent;scheme=market;package=com.android.vending;' +
        'S.browser_fallback_url=' + encodeURIComponent(AND_HTTPS) + ';end';
      var t = setTimeout(function(){ window.location.href = AND_HTTPS; }, 900);
      var clear = function(){ try { clearTimeout(t); } catch(e){} };
      document.addEventListener('visibilitychange', function(){ if (document.hidden) clear(); }, { once:true });
      window.addEventListener('pagehide', clear, { once:true });
      try { window.location.href = intentUrl; } catch(e){ clear(); window.location.href = AND_HTTPS; }
      return;
    }
    if (goIOS && isIOS) {
      var t2 = setTimeout(function(){ window.location.href = IOS_URL; }, 900);
      var clear2 = function(){ try { clearTimeout(t2); } catch(e){} };
      document.addEventListener('visibilitychange', function(){ if (document.hidden) clear2(); }, { once:true });
      window.addEventListener('pagehide', clear2, { once:true });
      try { window.location.href = IOS_NATIVE; } catch(e){ clear2(); window.location.href = IOS_URL; }
      return;
    }
    // Cross-platform fallback (e.g. App Store button tapped on Android, or desktop).
    // In-app browsers (Instagram/Facebook) silently block window.open, so try it but
    // fall back to a top-level navigation which always works.
    var fallbackUrl = goAndroid ? AND_HTTPS : IOS_URL;
    var popup = null;
    try { popup = window.open(fallbackUrl, '_blank'); } catch(e){}
    if (!popup) { window.location.href = fallbackUrl; }
  };
</script>

<style>
  :root{
    --bg:#000000;
    --surface:#0C0C0E;
    --border:rgba(255,255,255,.10);
    --border-2:rgba(255,255,255,.20);
    --text:#FFFFFF;
    --text-2:#9AA0AA;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 24px calc(32px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  ::selection{background:rgba(255,255,255,.20);color:#fff}
  img,svg{display:block;max-width:100%}
  a{font:inherit;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}

  .stage{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:22px;
  }

  /* App icon */
  .logo{
    width:104px;height:104px;border-radius:24px;
    display:grid;place-items:center;overflow:hidden;
    border:1px solid var(--border);
    box-shadow:0 10px 32px -12px rgba(255,255,255,.18);
  }
  .logo img{width:100%;height:100%;object-fit:cover}

  /* App name */
  .name{
    font-size:clamp(22px,6vw,40px);
    font-weight:800;
    letter-spacing:-.025em;
    line-height:1.1;
    color:var(--text);
    max-width:100%;
    text-wrap:balance;
  }
  .tagline{
    font-size:15px;
    font-weight:500;
    color:var(--text-2);
    letter-spacing:.01em;
    margin-top:-8px;
  }

  /* Language chips */
  .langs{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
  }
  .lang{
    display:inline-flex;align-items:center;gap:8px;
    padding:7px 14px;border-radius:999px;
    background:var(--surface);
    border:1px solid var(--border);
    font-size:13px;font-weight:600;color:var(--text);
    letter-spacing:.01em;
  }
  .lang svg{
    width:20px;height:14px;border-radius:3px;
    box-shadow:0 0 0 1px rgba(255,255,255,.12);
  }

  /* Store banners */
  .badges{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    width:100%;
    margin-top:6px;
  }
  @media(min-width:520px){
    .badges{flex-direction:row;justify-content:center;flex-wrap:wrap}
  }
  .badge{
    display:inline-flex;align-items:center;gap:12px;
    width:100%;max-width:280px;
    padding:14px 22px;border-radius:14px;
    background:var(--surface);
    border:1px solid var(--border);
    color:#fff;
    transition:transform .16s ease,border-color .16s ease,background .16s ease;
  }
  @media(min-width:520px){.badge{width:auto;min-width:200px}}
  .badge:hover{transform:translateY(-2px);border-color:var(--border-2);background:#141416}
  .badge:active{transform:translateY(0)}
  .badge .icon{flex-shrink:0;display:grid;place-items:center}
  .badge .txt{display:flex;flex-direction:column;line-height:1.15;text-align:left}
  .badge .small{font-size:11px;color:var(--text-2);font-weight:500;letter-spacing:.02em}
  .badge .big{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-top:1px;color:#fff}

  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }

  /* Short viewports — Instagram/Facebook open ad links in a half-height sheet, so the
     page gets far less height than a normal browser tab. Centering the content there
     pushes it off BOTH edges and the store buttons end up below the fold. Pin to the
     top and scale the artwork down so everything fits without scrolling.
     Placed last so these win over the base .logo/.name rules above. */
  @media (max-height:700px){
    body{
      align-items:flex-start;
      padding-top:20px;
      padding-bottom:calc(20px + env(safe-area-inset-bottom));
    }
    .stage{ gap:16px; }
    .logo{ width:84px;height:84px;border-radius:20px; }
    .name{ font-size:clamp(20px,5.4vw,32px); }
  }
  @media (max-height:560px){
    body{ padding-top:14px; }
    .stage{ gap:11px; }
    .logo{ width:64px;height:64px;border-radius:16px; }
    .name{ font-size:clamp(19px,5vw,26px); }
    .tagline{ font-size:14px;margin-top:-6px; }
    .badge{ padding:11px 20px; }
  }
</style>

<!-- Minimal language tag (no UI) — keeps ?lang=tr ad-segment tracking in analytics/CAPI -->
<script>
(function(){
  try {
    var m = window.location.search.match(/[?&]lang=(tr|en|ru)/i);
    var saved = localStorage.getItem('luna_lang');
    var lang = m ? m[1].toLowerCase() : ((saved === 'tr' || saved === 'en' || saved === 'ru') ? saved : 'en');
    document.documentElement.lang = (lang === 'ru' || lang === 'tr' || lang === 'en') ? lang : 'en';
    try { localStorage.setItem('luna_lang', lang); } catch(e){}
    window.__lunaLang = lang;
  } catch(e){ window.__lunaLang = 'en'; }
})();
</script>

<!-- Tracking -->
<script>
(function() {
  function getCookie(name){
    var m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]+)'));
    return m ? m[1] : undefined;
  }
  function setCookie(name, value, days){
    try {
      var d = new Date();
      d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
      document.cookie = name + '=' + value + ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax';
    } catch(e) {}
  }
  (function(){
    try {
      var m = window.location.search.match(/[?&]fbclid=([^&]+)/);
      if (!m) return;
      var fbclid = m[1];
      var existing = getCookie('_fbc');
      if (existing && existing.indexOf(fbclid) !== -1) return;
      setCookie('_fbc', 'fb.1.' + Date.now() + '.' + fbclid, 90);
    } catch(e){}
  })();
  (function(){
    try {
      if (getCookie('_fbp')) return;
      setCookie('_fbp', 'fb.1.' + Date.now() + '.' + Math.floor(Math.random()*2147483647), 90);
    } catch(e){}
  })();
  function getTestEventCode(){
    try {
      var m = window.location.search.match(/[?&]meta_test=([^&]+)/);
      if (m) { try { sessionStorage.setItem('meta_test', m[1]); } catch(e){} return m[1]; }
      try { return sessionStorage.getItem('meta_test') || undefined; } catch(e){ return undefined; }
    } catch(e){ return undefined; }
  }
  // Kalıcı external_id — dedup match anahtarı (Meta için "Harici Kod")
  function getExternalId(){
    try {
      var eid = localStorage.getItem('luna_eid');
      if (!eid) {
        eid = 'eid_' + Date.now().toString(36) + '_' +
              Math.random().toString(36).slice(2, 10) +
              Math.random().toString(36).slice(2, 10);
        localStorage.setItem('luna_eid', eid);
      }
      return eid;
    } catch(e){ return ''; }
  }
  window.__lunaEid = getExternalId();

  function sendCAPI(eventName, eventId, extra){
    try {
      var testCode = getTestEventCode();
      var payload = {
        event_name: eventName, event_id: eventId,
        event_time: Math.floor(Date.now() / 1000),  // browser zamanı — server-browser timing match için
        url: window.location.href,
        fbc: getCookie('_fbc'), fbp: getCookie('_fbp'),
        external_id: window.__lunaEid || getExternalId(),
        custom_data: extra || {}
      };
      if (testCode) payload.test_event_code = testCode;
      fetch('/api/capi', {
        method:'POST', headers:{'Content-Type':'application/json'},
        keepalive:true, body:JSON.stringify(payload)
      }).catch(function(){});
    } catch(e){}
  }
  window.trackStoreClick = function(store, location){
    try {
      var prefix = (store === 'AppStore') ? 'as_' : 'gp_';
      var customName = (store === 'AppStore') ? 'AppStoreClick' : 'GooglePlayClick';
      var leadId = prefix + 'lead_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
      var customId = prefix + 'cc_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
      var data = { content_name: store, location: location, lang: (window.__lunaLang || 'en') };
      if (window.fbq) {
        fbq('track', 'Lead', data, { eventID: leadId });
        fbq('trackCustom', customName, data, { eventID: customId });
      }
      sendCAPI('Lead', leadId, data);
      sendCAPI(customName, customId, data);
      // GA4 event
      if (window.gtag) {
        gtag('event', 'store_click', {
          store: store,
          location: location,
          lang: (window.__lunaLang || 'en')
        });
      }
      // Clarity custom event + tag
      if (window.clarity) {
        clarity('event', 'store_click');
        clarity('set', 'store', store);
        clarity('set', 'click_location', location);
      }
    } catch(e){}
  };

  // openStoreFromLink + openStore are defined EARLY in the <head> so a tap that lands
  // before this script runs still opens the store. On iOS they fire itms-apps://, which
  // iOS routes to the App Store app itself — never a web page inside the in-app browser.

  try {
    var pvId = 'pv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9);
    if (window.fbq) fbq('track', 'PageView', {}, { eventID: pvId });
    sendCAPI('PageView', pvId, { lang: (window.__lunaLang || 'en') });
  } catch(e){}
})();
</script>

<!-- Auto-redirect to the store (mobile only) — restored from the older page, where this
     is what actually got users into the App Store from Instagram. A top-level navigation
     to the https universal link that is NOT tied to a tap is the one route Meta's webview
     still honours; tapping the button alone is unreliable there. Any tap/scroll cancels
     it, so a user who reaches for the button themselves keeps the normal flow. -->
<script>
(function(){
  try {
    // ?noredirect=1 disables it (handy for checking the page itself).
    if (/[?&]noredirect=1/.test(window.location.search)) return;

    var ua = navigator.userAgent || '';
    var isIOS = /iphone|ipad|ipod/i.test(ua);
    var isAndroid = /android/i.test(ua);
    if (!isIOS && !isAndroid) return; // desktop just reads the page

    var isInApp = /instagram|fbav|fban|fb_iab|fbios|messenger/i.test(ua);
    var delay = isInApp ? 1800 : 1200; // let the in-app sheet settle first

    var url = isIOS
      ? 'https://apps.apple.com/app/id6740998772'
      : 'https://play.google.com/store/apps/details?id=com.luna.russianstories';

    // Any deliberate interaction cancels the auto-redirect.
    var aborted = false;
    function abort(){ aborted = true; }
    document.addEventListener('click', abort, true);
    document.addEventListener('touchstart', abort, { capture:true, passive:true });
    document.addEventListener('touchmove',  abort, { capture:true, passive:true });
    // If the page is EVER backgrounded, kill the auto-redirect for good. An early tap
    // (before this script ran) can open the App Store without setting `aborted`; this
    // timer then suspends while Instagram is in the background and would fire the
    // moment the user comes BACK from the store — yanking them there again and firing
    // a duplicate Lead/CAPI 'auto_redirect' event on an already-tracked journey.
    window.addEventListener('pagehide', abort, { once:true });
    document.addEventListener('visibilitychange', function(){ if (document.hidden) abort(); });

    setTimeout(function(){
      if (aborted) return;
      try {
        if (window.trackStoreClick) {
          window.trackStoreClick(isIOS ? 'AppStore' : 'GooglePlay', 'auto_redirect');
        }
      } catch(e){}
      window.location.href = url;
    }, delay);
  } catch(e){}
})();
</script>

</body>
